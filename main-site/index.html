<!doctype html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FMCYFTFPEL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());

        gtag('config', 'G-FMCYFTFPEL');
    </script>

    <link rel="manifest" href="/manifest.json" />

    <meta charset="utf-8">
    <title>Cocktail Guide | UwU Apps</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Look up any cocktail's ingredients and method, even offline.">
    <link rel="canonical" href="https://cocktails.uwuapps.org/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Cocktail Guide | UwU Apps" />
    <meta property="og:site_name" content="UwU Apps" />
    <meta property="og:description" content="Look up any cocktail's ingredients and method, even offline." />
    <meta property="og:url" content="https://cocktails.uwuapps.org/" />

    <!-- Theme before first paint. Keep the key in sync with APP_KEY in /js/theme.js. -->
    <script>
        (function () {
            var k = "cocktailguide";
            var m = localStorage.getItem(k + ".mode") || "light";

            // Time based mode. Resolved here rather than in theme.js because
            // theme.js runs after first paint, and an evening reader would
            // otherwise watch a white page turn dark. Keep the two hours in step
            // with LIGHT_FROM_HOUR and LIGHT_UNTIL_HOUR in theme.js.
            document.documentElement.setAttribute("data-mode-preference", m);
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
            }

            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
        })();
    </script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
    <link rel="stylesheet" href="/style.css">
    <meta name="theme-color" content="#ccffcc" />

    <!-- Embed Image -->
    <link rel="apple-touch-icon" href="/XCG-main.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="https://cocktails.uwuapps.org/XCG-main.png">
    <meta property="og:image" content="https://cocktails.uwuapps.org/XCG-main.png" />
</head>

<body>
    <header class="topbar">
        <h1>Cocktail Guide</h1>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme">
            <span data-icon="sun"></span>
        </button>
    </header>

    <main class="container">
        <section class="card glass">
            <form class="search-container" id="search-form" role="search">
                <input type="search" placeholder="Search for a cocktail" id="user-inp" value="margarita"
                    aria-label="Cocktail name" autocomplete="off" />
                <button class="btn btn-primary" id="search-btn" type="submit">Search</button>
            </form>
            <div id="result" aria-live="polite"></div>
        </section>
    </main>

    <div class="modal-backdrop hidden" id="themeModal">
        <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
            <div class="modal-head">
                <h2 id="themeModalTitle">Theme</h2>
                <button class="icon-btn small" type="button" data-close-modal="themeModal" aria-label="Close">
                    <span data-icon="close"></span>
                </button>
            </div>
            <p class="modal-section-label">Mode</p>
            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn" type="button" data-mode="light" aria-pressed="false"><span data-icon="sun"></span>Light</button>
                <button class="mode-btn" type="button" data-mode="dark" aria-pressed="false"><span data-icon="moon"></span>Dark</button>
                <button class="mode-btn mode-btn-wide" type="button" data-mode="time" aria-pressed="false"><span data-icon="clock"></span>Time-based</button>
            </div>
            <p class="mode-note" id="modeNote" hidden></p>
            <p class="modal-section-label">Brand colour</p>
            <div class="swatch-grid" id="swatchGrid"></div>
        </div>
    </div>

    <script type="module" src="/script.js"></script>
</body>

</html>
